name: CI and build delivery

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: '1'

jobs:
  frontend:
    name: Frontend lint and types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        if: ${{ !cancelled() }}
        run: npm run typecheck

  backend:
    name: Python correctness checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install ruff==0.17.5
      - name: Ruff correctness rules
        run: ruff check backend --select E9,F63,F7,F82 --output-format=github
      - name: Compile Python modules
        run: python -m compileall -q backend

  build:
    name: Build and deliver web artifact
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-build-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

  pr-review:
    name: Automated PR review comment
    needs: [frontend, backend, build]
    if: >-
      ${{ always() && !cancelled() && github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      # No checkout or execution of PR code in the job with a write token.
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        with:
          script: |
            const marker = '<!-- bball-automated-review -->';
            const results = [
              ['Frontend lint and types', process.env.FRONTEND_RESULT],
              ['Python correctness checks', process.env.BACKEND_RESULT],
              ['Web build and downloadable artifact', process.env.BUILD_RESULT],
            ];
            const passed = results.every(([, result]) => result === 'success');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              '### Automated code review',
              `Commit: ${context.payload.pull_request.head.sha.slice(0, 12)}`,
              '',
              ...results.map(([name, result]) => `- ${name}: **${result}**`),
              '',
              passed ? 'All automated checks passed.' : 'Fix the failed checks before merging; skipped builds need passing checks first.',
              `[View diagnostics and download the web build](${runUrl})`,
              '',
              'Scope: static checks and web compilation. Local video/model inference and human review are still required.',
            ].join('\n');
            const issue = { ...context.repo, issue_number: context.issue.number };
            const comments = await github.paginate(github.rest.issues.listComments, { ...issue, per_page: 100 });
            const existing = comments.find(comment => comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...issue, body });
            }
